[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction-system"
version = "0.1.0"
description = "End-to-end machine learning system for predicting customer churn."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Salehin Haque" }]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["src", "app"]
skip = [".venv", "venv", "build", "dist"]

# NOTE: Flake8 does not natively read pyproject.toml.
# The active Flake8 configuration is in the .flake8 file at the project root.
# This section is kept here for documentation purposes only.
[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [".git", ".venv", "venv", "build", "dist", "__pycache__"]
per-file-ignores = ["__init__.py:F401"]
